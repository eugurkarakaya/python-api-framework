name: API Tests

on:
 push:
  branches: [main]
 pull_request:
  branches: [main]

jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - name: Checkout_repository
     uses: actions/checkout@v4

   - name: Set up Python
     uses: actions/checkout@v4
     with:
      python-version: "3.11"

   - name: Install dependencies
     run: pip install -r requirements.txt

   - name: Run mock tests
     run: python -m pytest tests/test_auth_mock.py tests/test_first_api_mock.py -v
     
  
